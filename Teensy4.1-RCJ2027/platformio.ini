; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[project_options]
;program_name = sense
;program_name = act
;program_name = act_kicker
;program_name = act_kicker_ball
;program_name = buffer_test
;program_name = line_sensing
;program_name = mux2_test
;program_name = sense_defense
;program_name = act_defense
;program_name = dma_test
;program_name = ir_sensing
;program_name = ir_sensing_max
;program_name = test
program_name = sense_ir
;program_name = cam_v2_test
;program_name = ball_sensing
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -I include
build_src_filter = +<*.h> +<${project_options.program_name}.cpp>    