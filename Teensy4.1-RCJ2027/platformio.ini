; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[project_options]
; ===== game programs (src/) =====
;program_name = act_attack           ; T11 Act
;program_name = act_attack2          ; T11b Act: T11 + IR orbit + ultrasonic (Sense USE_MUX2 0)
;program_name = act_attack3          ; T11c Act: basic chase + line lock (MOTOR_REVERSE 1)
;program_name = act_attack4          ; T11d Act: attack3 + mux 2 early brake (Sense: sense_attack)
program_name = act_defense_smach    ; T12 Act (defense state machine)
;program_name = act_defense_smach2   ; T12b Act: T12 + mux 1 whole-ring guard in DEFEND
;program_name = act_defense_smach3   ; T12c Act: smach2 with F_out as the stop point
;program_name = act_defense
;program_name = act
;program_name = sense                ; Sense core for BOTH robots (USE_MUX2: 1 defense, 0 attack)
;program_name = sense_defense        ; Sense for the DEFENSE robot (mux 2, no mask)
;program_name = sense_attack         ; Sense for the ATTACK robot (mux 2, ring ch 7 masked)
; ===== older test programs (src/test/) =====
;program_name = buffer_test
;program_name = line_sensing
;program_name = mux2_test
;program_name = dma_test
;program_name = ir_sensing
;program_name = ir_sensing_max
;program_name = test
;program_name = ball_sensing
;program_name = test_kicker_manual   ; kicker circuit only: serial c / k / x, button (no library)
;program_name = test_kicker_raw      ; kicker + ball sensor only (no library)
; ===== plan sheet tests T01-T10 (src/test/) =====
;program_name = test_sense_tx        ; T01 Sense
;program_name = test_sense_link      ; T02 Act
;program_name = test_line_scan_rate  ; T03 Sense
;program_name = test_camera_v2       ; T04 Act (+ main.py on the Maix Cam)
;program_name = test_kicker          ; T05 Act
;program_name = test_loop_rate       ; T06 Act
;program_name = test_back_to_field   ; T07 Act
;program_name = test_shoot           ; T08 Act
;program_name = test_chase           ; T09 Act
;program_name = test_vector_field    ; T10 Act
;program_name = test_sprint          ; sprint / wheel slip (ACCEL_MAX), no cable needed
;program_name = test_us              ; R03 Sense: ultrasonic H1-H4 raw data (USB serial)
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -I include
extra_scripts = pre:check_program.py
; game programs are in src/, test programs in src/test/: program_name is just the file name
build_src_filter = +<*.h> +<${project_options.program_name}.cpp> +<test/${project_options.program_name}.cpp>    