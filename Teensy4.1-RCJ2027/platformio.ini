; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[project_options]
; ===== WHICH PROGRAM TO BUILD: change only this line (just the file name, no .cpp) =====
program_name = act_defense_smach

; ----- names you can put above -----
; game programs (src/):
;   act_attack          T11 Act
;   act_attack2         T11b Act (T11 + IR orbit + ultrasonic, Sense USE_MUX2 0)
;   act_attack3         T11c Act (basic chase + line lock, MOTOR_REVERSE 1)
;   act_attack4         T11d Act (attack3 + mux 2 early brake; Sense: sense_attack)
;   act_attack5         T11e Act (attack4 + front ultrasonic always, calm in front of their goal; Sense: sense_attack)
;   sense_defense       Sense for the DEFENSE robot (mux 2, no mask)
;   sense_attack        Sense for the ATTACK robot (mux 2, ring ch 7 masked)
;   act_defense_smach   T12 Act (defense state machine)
;   act_defense_smach2  T12b Act (T12 + mux 1 whole-ring guard in DEFEND)
;   act_defense_smach3  T12c Act (smach2 with F_out as the stop point)
;   act_defense_smach4  T12d Act (smach3 with F_in as the stop point, stands farther out)
;   act_defense_smach5  T12e Act (smach4 + F_out at the corners + heading I term)
;   act_defense_smach6  T12f Act (smach5 rewritten short, ~26 tuning parameters)
;   act_defense
;   act
;   sense               Sense core for BOTH robots (USE_MUX2: 1 defense, 0 attack)
; plan sheet tests (src/test/):
;   test_sense_tx       T01 Sense
;   test_sense_link     T02 Act (D1: line sensor bits)
;   test_line_scan_rate T03 Sense
;   test_camera_v2      T04 Act (D1: goal angle / distance) + goal_ball_detection.py on the Maix Cam
;   test_kicker         T05 Act
;   test_loop_rate      T06 Act
;   test_back_to_field  T07 Act
;   test_shoot          T08 Act
;   test_chase          T09 Act
;   test_vector_field   T10 Act
;   test_sprint         sprint / wheel slip (ACCEL_MAX), no cable needed
;   test_us             R03 Sense: ultrasonic H1-H4 raw data (USB serial)
; older tests (src/test/):
;   buffer_test, line_sensing, mux2_test, dma_test, ir_sensing, ir_sensing_max, test, ball_sensing,
;   test_kicker_manual (kicker circuit only, no library), test_kicker_raw (kicker + ball sensor, no library)

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -I include
extra_scripts = pre:check_program.py
; game programs are in src/, test programs in src/test/: program_name is just the file name
build_src_filter = +<*.h> +<${project_options.program_name}.cpp> +<test/${project_options.program_name}.cpp>    