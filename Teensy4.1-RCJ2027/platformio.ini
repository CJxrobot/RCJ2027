; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[project_options]
;program_name = sense
;program_name = act
;program_name = act_kicker
program_name = act_kicker_ball
;program_name = buffer_test
;program_name = line_sensing
;program_name = mux2_test
;program_name = sense_defense
;program_name = act_defense
;program_name = dma_test
;program_name = ir_sensing
;program_name = ir_sensing_max
;program_name = test
;program_name = ball_sensing
; ----- RCJ2027 attack migration: see the plan sheet, Tasks tab -----
;program_name = test_sense_tx        ; T01 Sense
;program_name = test_sense_link      ; T02 Act
;program_name = test_line_scan_rate  ; T03 Sense
;program_name = test_camera_v2       ; T04 Act (+ cam_fake_v2.py on the Maix Cam)
;program_name = test_kicker          ; T05 Act
;program_name = test_loop_rate       ; T06 Act
;program_name = test_back_to_field   ; T07 Act
;program_name = test_kick_rotate     ; T08 Act
;program_name = test_chase           ; T09 Act
;program_name = test_vector_field    ; T10 Act
;program_name = act_attack           ; T11 Act
;program_name = sense_attack         ; T11 Sense
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -I include
build_src_filter = +<*.h> +<${project_options.program_name}.cpp>    