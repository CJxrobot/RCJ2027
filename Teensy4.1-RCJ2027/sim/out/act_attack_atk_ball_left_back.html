const LIVE = SIM === null;
// frame: [t, rx, ry, rh, bx, by, bvis, w0, w1, w2, w3, lineState, flag, hold]
const cv = document.getElementById('c'), g = cv.getContext('2d');
const S = 2.5;                                    // px per cm
const W = 182, H = 243;                           // field with out area, cm
const px = x => (x + W / 2) * S, py = y => (H / 2 - y) * S;
const $ = id => document.getElementById(id);
let sensors = [], playing = true;

function line(x1, y1, x2, y2) { g.beginPath(); g.moveTo(px(x1), py(y1)); g.lineTo(px(x2), py(y2)); g.stroke(); }

function drawField() {
  g.clearRect(0, 0, cv.width, cv.height);
  g.strokeStyle = '#fff'; g.lineWidth = 2 * S;
  g.strokeRect(px(-78), py(108.5), 156 * S, 217 * S);
  for (const s of [-1, 1]) {                      // penalty areas with rounded corners
    const yg = s * 108.5, yf = s * 84.5, ya = s * 99.5;
    line(-39, yg, -39, ya); line(39, yg, 39, ya); line(-24, yf, 24, yf);
    for (const k of [-1, 1]) {
      // quarter circle toward the field centre; a0 = start angle in field coordinates
      const a0 = s < 0 ? (k > 0 ? 0 : Math.PI / 2) : (k > 0 ? -Math.PI / 2 : Math.PI);
      g.beginPath(); g.arc(px(k * 24), py(ya), 15 * S, -a0 - Math.PI / 2, -a0, false); g.stroke();
    }
  }
  g.fillStyle = '#1565c0'; g.fillRect(px(-30), py(-109.5), 60 * S, 7.4 * S);       // our goal (blue)
  g.fillStyle = '#f9a825'; g.fillRect(px(-30), py(116.9), 60 * S, 7.4 * S);       // their goal (yellow)
}

// f = frame, trail = recent frames (last one = f), lines = console lines up to now
function drawFrame(f, trail, lines) {
  drawField();
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1; g.beginPath();
  for (const k of trail) g.lineTo(px(k[1]), py(k[2]));
  g.stroke();
  // robot (purple = holding the ball)
  const [t, rx, ry, rh] = f, a = rh * Math.PI / 180;
  g.fillStyle = f[13] ? '#6a1b9a' : '#333'; g.beginPath(); g.arc(px(rx), py(ry), 11 * S, 0, 7); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 2; line(rx, ry, rx + 11 * Math.cos(a), ry + 11 * Math.sin(a));
  // line sensors (red = sees the line, blue = mux 2)
  for (const [deg, r, bit] of sensors) {
    const b = (rh - 90 + deg) * Math.PI / 180, seen = !((f[11] >>> bit) & 1);
    g.fillStyle = seen ? '#ff1744' : (bit >= 16 ? '#80deea' : '#bbb');
    g.beginPath(); g.arc(px(rx + r * Math.cos(b)), py(ry + r * Math.sin(b)), seen ? 3.5 : 2, 0, 7); g.fill();
  }
  // velocity arrow from the last two frames
  const p = trail.length > 1 ? trail[trail.length - 2] : f, dt = Math.max(t - p[0], 1e-3);
  const vx = (rx - p[1]) / dt, vy = (ry - p[2]) / dt;
  g.strokeStyle = '#ffeb3b'; g.lineWidth = 2; line(rx, ry, rx + vx * 0.15, ry + vy * 0.15);
  if (f[6]) { g.fillStyle = '#ff6d00'; g.beginPath(); g.arc(px(f[4]), py(f[5]), 2.1 * S + 1, 0, 7); g.fill(); }

  // newest state printed by the program
  let state = '';
  for (const [, text] of lines) {
    const m = text.match(/-> (\w+)/) || text.match(/^(\w+)\s+\(/);
    if (m) state = m[1];
  }
  $('info').innerHTML =
    `<div class="state">${state}</div>` +
    `t ${t.toFixed(2)} s &nbsp; speed ${Math.hypot(vx, vy).toFixed(0)} cm/s &nbsp; heading ${rh.toFixed(0)}<br>` +
    `wheels % ${f.slice(7, 11).map(v => v.toFixed(0).padStart(4)).join(' ')}<br>` +
    `line flag ${f[12]} &nbsp; ball held ${f[13]} &nbsp; robot (${rx.toFixed(0)}, ${ry.toFixed(0)})`;
  $('log').innerHTML = lines.slice(-60).map(([c, x]) =>
    `<span class="${x.startsWith('[SIM]') ? 'sim' : (x.includes('->') ? 'state' : '')}">${(c / 1000).toFixed(2).padStart(6)}  ${x.replace(/</g, '&lt;')}</span>`).join('\n');
  $('log').scrollTop = $('log').scrollHeight;
}

$('play').onclick = e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; };
const speed = () => parseFloat($('speed').value);

// ===================== Replay =====================
function startReplay() {
  const F = SIM.frames, slider = $('time');
  sensors = SIM.sensors;
  $('title').textContent = SIM.prog + '  /  ' + SIM.name + ':  ' + SIM.desc;
  slider.max = F.length - 1;
  let i = 0, last = performance.now(), acc = 0;
  const draw = () => {
    const lines = SIM.console.filter(([c]) => c <= F[i][0] * 1000);
    drawFrame(F[i], F.slice(Math.max(0, i - 150), i + 1), lines);
    slider.value = i;
  };
  function tick(now) {
    if (playing) {
      acc += (now - last) / 1000 * speed();
      while (i < F.length - 1 && F[i + 1][0] - F[i][0] <= acc) { acc -= F[i + 1][0] - F[i][0]; i++; }
      if (i >= F.length - 1) { playing = false; $('play').textContent = 'Play'; }
      draw();
    }
    last = now;
    requestAnimationFrame(tick);
  }
  $('play').addEventListener('click', () => { if (i >= F.length - 1) i = 0; acc = 0; });
  slider.oninput = () => { i = +slider.value; acc = 0; draw(); };
  const jump = location.hash.match(/t=([\d.]+)/);   // page.html#t=3.5 opens paused at 3.5 s
  if (jump) {
    while (i < F.length - 1 && F[i][0] < +jump[1]) i++;
    playing = false; $('play').textContent = 'Play';
  }
  draw();
  requestAnimationFrame(tick);
}

// ===================== Live =====================
// Mouse: click = put the ball there, drag = move / throw it. Drag the robot to move it.
async function startLive() {
  const info = await (await fetch('/info')).json();
  sensors = info.sensors;
  $('title').textContent = info.prog + '  /  ' + info.desc;
  $('time').style.display = 'none';
  for (const e of document.querySelectorAll('.live-only')) e.style.display = 'inline';
  let drag = 0, mx = 0, my = 0, hide = 0, f = null, last = performance.now();
  const trail = [], lines = [];

  const toField = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / S - W / 2, H / 2 - (e.clientY - r.top) / S]; };
  cv.onmousedown = e => {
    [mx, my] = toField(e);
    const nearRobot = f && Math.hypot(mx - f[1], my - f[2]) < 13;
    const nearBall = f && f[6] && Math.hypot(mx - f[4], my - f[5]) < 10;
    drag = nearRobot && !nearBall ? 2 : 1;
  };
  cv.onmousemove = e => { [mx, my] = toField(e); };
  window.onmouseup = () => { drag = 0; };
  $('hide').onclick = () => { hide = 1; };

  async function tick() {
    const now = performance.now(), ms = Math.min(now - last, 50) * speed();
    last = now;
    if (playing) {
      try {
        const q = `/step?ms=${ms.toFixed(1)}&drag=${drag}&x=${mx.toFixed(1)}&y=${my.toFixed(1)}&hide=${hide}`;
        hide = 0;
        const r = await (await fetch(q)).json();
        f = r.f;
        trail.push(f); if (trail.length > 150) trail.shift();
        lines.push(...r.log); if (lines.length > 500) lines.splice(0, lines.length - 500);
        drawFrame(f, trail, lines);
      } catch (err) {
        $('info').textContent = 'Simulator stopped. Run it again: run.bat live';
        return;
      }
    }
    requestAnimationFrame(tick);
  }
  tick();
}

if (LIVE) startLive(); else startReplay();
