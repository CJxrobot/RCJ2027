<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RCJ sim</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 12px; background: #f4f4f4; color: #222; }
  #wrap { display: flex; gap: 16px; align-items: flex-start; }
  canvas { background: #2e7d32; border-radius: 6px; }
  #side { width: 460px; }
  #info { font-family: monospace; font-size: 13px; line-height: 1.5; background: #fff; padding: 8px; border-radius: 6px; }
  #log { font-family: monospace; font-size: 12px; background: #111; color: #ddd; padding: 8px; border-radius: 6px;
         height: 260px; overflow-y: auto; white-space: pre; margin-top: 8px; }
  #log .sim { color: #ffcc66; }
  #log .state { color: #7fd0ff; }
  button { font-size: 14px; padding: 4px 10px; }
  input[type=range] { width: 100%; }
  .state { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<h3 id="title"></h3>
<div id="wrap">
  <canvas id="c" width="455" height="607"></canvas>
  <div id="side">
    <div>
      <button id="play">Pause</button>
      <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select> x
    </div>
    <input id="time" type="range" min="0" value="0">
    <div id="info"></div>
    <div id="log"></div>
  </div>
</div>
<script>
const SIM = __SIM_DATA__;
// frame: [t, rx, ry, rh, bx, by, bvis, w0, w1, w2, w3, lineState, flag, hold]
const F = SIM.frames, cv = document.getElementById('c'), g = cv.getContext('2d');
const S = 2.5;                                    // px per cm
const W = 182, H = 243;                           // field with out area, cm
const px = x => (x + W / 2) * S, py = y => (H / 2 - y) * S;
document.getElementById('title').textContent = SIM.prog + '  /  ' + SIM.name + ':  ' + SIM.desc;
const slider = document.getElementById('time');
slider.max = F.length - 1;
let i = 0, playing = true, last = performance.now(), acc = 0;

function line(x1, y1, x2, y2) { g.beginPath(); g.moveTo(px(x1), py(y1)); g.lineTo(px(x2), py(y2)); g.stroke(); }

function drawField() {
  g.clearRect(0, 0, cv.width, cv.height);
  g.strokeStyle = '#fff'; g.lineWidth = 2 * S;
  g.strokeRect(px(-78), py(108.5), 156 * S, 217 * S);
  for (const s of [-1, 1]) {                      // penalty areas with rounded corners
    const yg = s * 108.5, yf = s * 84.5, ya = s * 99.5;
    line(-39, yg, -39, ya); line(39, yg, 39, ya); line(-24, yf, 24, yf);
    for (const k of [-1, 1]) {
      // quarter circle toward the field centre; a0 = start angle in field coordinates
      const a0 = s < 0 ? (k > 0 ? 0 : Math.PI / 2) : (k > 0 ? -Math.PI / 2 : Math.PI);
      g.beginPath(); g.arc(px(k * 24), py(ya), 15 * S, -a0 - Math.PI / 2, -a0, false); g.stroke();
    }
  }
  g.fillStyle = '#1565c0'; g.fillRect(px(-30), py(-109.5), 60 * S, 7.4 * S);       // our goal (blue)
  g.fillStyle = '#f9a825'; g.fillRect(px(-30), py(116.9), 60 * S, 7.4 * S);       // their goal (yellow)
}

function draw() {
  const f = F[i];
  drawField();
  // trail
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1; g.beginPath();
  for (let k = Math.max(0, i - 150); k <= i; k++) g.lineTo(px(F[k][1]), py(F[k][2]));
  g.stroke();
  // robot
  const [t, rx, ry, rh] = f, a = rh * Math.PI / 180;
  g.fillStyle = f[13] ? '#6a1b9a' : '#333'; g.beginPath(); g.arc(px(rx), py(ry), 11 * S, 0, 7); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 2; line(rx, ry, rx + 11 * Math.cos(a), ry + 11 * Math.sin(a));
  // line sensors (red = sees the line)
  for (const [deg, r, bit] of SIM.sensors) {
    const b = (rh - 90 + deg) * Math.PI / 180, seen = !((f[11] >>> bit) & 1);
    g.fillStyle = seen ? '#ff1744' : (bit >= 16 ? '#80deea' : '#bbb');
    g.beginPath(); g.arc(px(rx + r * Math.cos(b)), py(ry + r * Math.sin(b)), seen ? 3.5 : 2, 0, 7); g.fill();
  }
  // velocity arrow (from the next frame)
  const n = F[Math.min(i + 1, F.length - 1)], dt = Math.max(n[0] - t, 1e-3);
  g.strokeStyle = '#ffeb3b'; g.lineWidth = 2; line(rx, ry, rx + (n[1] - rx) / dt * 0.15, ry + (n[2] - ry) / dt * 0.15);
  // ball
  if (f[6]) { g.fillStyle = '#ff6d00'; g.beginPath(); g.arc(px(f[4]), py(f[5]), 2.1 * S + 1, 0, 7); g.fill(); }

  // text: newest state line printed by the program
  const ms = t * 1000;
  let state = '', lines = [];
  for (const [cms, text] of SIM.console) {
    if (cms > ms) break;
    lines.push([cms, text]);
    const m = text.match(/-> (\w+)/) || text.match(/^(\w+)\s+\(/);
    if (m) state = m[1];
  }
  const speed = Math.hypot(n[1] - rx, n[2] - ry) / dt;
  document.getElementById('info').innerHTML =
    `<div class="state">${state}</div>` +
    `t ${t.toFixed(2)} s &nbsp; speed ${speed.toFixed(0)} cm/s &nbsp; heading ${rh.toFixed(0)}<br>` +
    `wheels % ${f.slice(7, 11).map(v => v.toFixed(0).padStart(4)).join(' ')}<br>` +
    `line flag ${f[12]} &nbsp; ball held ${f[13]} &nbsp; robot (${rx.toFixed(0)}, ${ry.toFixed(0)})`;
  const log = document.getElementById('log');
  log.innerHTML = lines.slice(-60).map(([c, x]) =>
    `<span class="${x.startsWith('[SIM]') ? 'sim' : (x.includes('->') ? 'state' : '')}">${(c / 1000).toFixed(2).padStart(6)}  ${x.replace(/</g, '&lt;')}</span>`).join('\n');
  log.scrollTop = log.scrollHeight;
  slider.value = i;
}

function tick(now) {
  if (playing) {
    acc += (now - last) / 1000 * parseFloat(document.getElementById('speed').value);
    while (i < F.length - 1 && F[i + 1][0] - F[i][0] <= acc) { acc -= F[i + 1][0] - F[i][0]; i++; }
    if (i >= F.length - 1) { playing = false; document.getElementById('play').textContent = 'Play'; }
    draw();
  }
  last = now;
  requestAnimationFrame(tick);
}
document.getElementById('play').onclick = e => {
  if (i >= F.length - 1) i = 0;
  playing = !playing; acc = 0; e.target.textContent = playing ? 'Pause' : 'Play';
};
slider.oninput = () => { i = +slider.value; acc = 0; draw(); };
// page.html#t=3.5 opens paused at 3.5 s
const jump = location.hash.match(/t=([\d.]+)/);
if (jump) {
  while (i < F.length - 1 && F[i][0] < +jump[1]) i++;
  playing = false; document.getElementById('play').textContent = 'Play';
}
draw();
requestAnimationFrame(tick);
</script>
</body>
</html>
